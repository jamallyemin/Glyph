<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glyph</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrap">
        <header class="top">
            <h1>Glyph<span>.</span></h1>
            <p class="sub">find the rule </p>
        </header>

        <nav class="tabs">
            <button class="tab  active" id="tab-endless">Endless</button>
            <button class="tab" id="tab-daily">Daily</button>
        </nav>

        <div class="statline">
            <div class="pills" id="pills"></div>
            <div class="level-badge" id="tier-tag">Tier 1</div>
        </div>

        <div class="progress-wrap" id="progress-wrap">
            <div class="progress-label" id="progress-label"></div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <main id="game-area"></main>

        <footer>runs in your browser - scores stay on this device</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
